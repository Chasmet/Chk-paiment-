name: CHK Paiements — APK TEST sur GitHub Releases
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/preview-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chk-paiements-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Installer SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Tests et APK de test
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Vérifier APK debug
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" CHK-Paiements-TEST.apk
          sha256sum CHK-Paiements-TEST.apk > SHA256SUMS.txt
      - name: Publier GitHub Release d'essai
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="test-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" CHK-Paiements-TEST.apk SHA256SUMS.txt --target "$GITHUB_SHA" \
            --prerelease --title "CHK Paiements TEST $TAG" \
            --notes "Version de test non commerciale. APK debug com.chk.paiements.debug. Pas de paiement réel ni de serveur HTTPS actifs automatiquement. Signature de debug propre au runner : ne convient pas aux mises à jour stables SkillMajAuto."
