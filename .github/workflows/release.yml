name: CHK Paiements - Release signée SkillMajAuto
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version stable semver, par ex. 0.1.0"
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Contrôler version et signature persistante
        env:
          VERSION: ${{ inputs.version }}
          PAYMENTS_KEYSTORE_BASE64: ${{ secrets.PAYMENTS_KEYSTORE_BASE64 }}
          PAYMENTS_KEYSTORE_PASSWORD: ${{ secrets.PAYMENTS_KEYSTORE_PASSWORD }}
          PAYMENTS_KEY_ALIAS: ${{ secrets.PAYMENTS_KEY_ALIAS }}
          PAYMENTS_KEY_PASSWORD: ${{ secrets.PAYMENTS_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version SemVer X.Y.Z requise"; exit 1
          fi
          if test -z "$PAYMENTS_KEYSTORE_BASE64" || test -z "$PAYMENTS_KEYSTORE_PASSWORD" ||
             test -z "$PAYMENTS_KEY_ALIAS" || test -z "$PAYMENTS_KEY_PASSWORD"; then
            echo "::error::Secrets PAYMENTS_KEYSTORE_* requis"; exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Version déjà publiée"; exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          printf '%s' "$PAYMENTS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/chk-paiements-upload.jks"
          chmod 600 "$RUNNER_TEMP/chk-paiements-upload.jks"
          echo "PAYMENTS_KEYSTORE_FILE=$RUNNER_TEMP/chk-paiements-upload.jks" >> "$GITHUB_ENV"
        shell: bash
      - name: SDK Android 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compiler APK Release signé
        env:
          PAYMENTS_KEYSTORE_PASSWORD: ${{ secrets.PAYMENTS_KEYSTORE_PASSWORD }}
          PAYMENTS_KEY_ALIAS: ${{ secrets.PAYMENTS_KEY_ALIAS }}
          PAYMENTS_KEY_PASSWORD: ${{ secrets.PAYMENTS_KEY_PASSWORD }}
        run: |
          gradle --no-daemon :app:assembleRelease -PversionCode="$RELEASE_CODE" -PversionName="$RELEASE_VERSION"
          test -s app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "CHK-Paiements-$RELEASE_VERSION.apk"
          sha256sum "CHK-Paiements-$RELEASE_VERSION.apk" > SHA256SUMS.txt
      - name: Conserver APK signé et somme de contrôle
        uses: actions/upload-artifact@v4
        with:
          name: chk-paiements-signed-${{ github.run_number }}
          path: |
            CHK-Paiements-*.apk
            SHA256SUMS.txt
          retention-days: 5
      - name: Publier sur GitHub Releases pour SkillMajAuto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$RELEASE_VERSION" "CHK-Paiements-$RELEASE_VERSION.apk" SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "CHK Paiements $RELEASE_VERSION" \
            --notes "Application Android privée. Mise à jour SkillMajAuto ; confirmer l'installation dans Android."
