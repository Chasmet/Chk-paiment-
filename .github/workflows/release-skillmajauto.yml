name: CHK Paiements — Release SkillMajAuto signée
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version stable exacte (ex : 0.1.0)'
        required: true
        type: string
      version_code:
        description: 'Code Android croissant (ex : 10100)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: chk-paiements-stable-release
  cancel-in-progress: false
jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Vérifier présence de la signature persistante
        id: signature
        env:
          STORE: ${{ secrets.PAYMENTS_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.PAYMENTS_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.PAYMENTS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PAYMENTS_KEY_PASSWORD }}
        run: |
          if [[ -n "$STORE" && -n "$PASSWORD" && -n "$ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Première signature Android permanente non provisionnée. Aucune Release ne sera créée afin de garantir les mises à jour futures."
          fi
      - name: Valider version et code
        if: steps.signature.outputs.ready == 'true'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CODE: ${{ inputs.version_code }}
        run: |
          if [[ -z "$RELEASE_VERSION" ]]; then RELEASE_VERSION="0.1.${GITHUB_RUN_NUMBER}"; fi
          if [[ -z "$RELEASE_CODE" ]]; then RELEASE_CODE="$((10000 + GITHUB_RUN_NUMBER))"; fi
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Version incorrecte'; exit 1; }
          [[ "$RELEASE_CODE" =~ ^[1-9][0-9]{0,8}$ ]] || { echo 'versionCode incorrect'; exit 1; }
          echo "VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$RELEASE_CODE" >> "$GITHUB_ENV"
          echo "ASSET=CHK-Paiements-$RELEASE_VERSION.apk" >> "$GITHUB_ENV"
      - name: Installer SDK Android
        if: steps.signature.outputs.ready == 'true'
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Préparer signature propriétaire
        if: steps.signature.outputs.ready == 'true'
        env:
          PAYMENTS_KEYSTORE_BASE64: ${{ secrets.PAYMENTS_KEYSTORE_BASE64 }}
          PAYMENTS_KEYSTORE_PASSWORD: ${{ secrets.PAYMENTS_KEYSTORE_PASSWORD }}
          PAYMENTS_KEY_ALIAS: ${{ secrets.PAYMENTS_KEY_ALIAS }}
          PAYMENTS_KEY_PASSWORD: ${{ secrets.PAYMENTS_KEY_PASSWORD }}
        run: |
          test -n "$PAYMENTS_KEYSTORE_BASE64"
          test -n "$PAYMENTS_KEYSTORE_PASSWORD"
          test -n "$PAYMENTS_KEY_ALIAS"
          test -n "$PAYMENTS_KEY_PASSWORD"
          printf '%s' "$PAYMENTS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/chk-paiements-release.jks"
          chmod 600 "$RUNNER_TEMP/chk-paiements-release.jks"
          test -s "$RUNNER_TEMP/chk-paiements-release.jks"
          echo "PAYMENTS_KEYSTORE_FILE=$RUNNER_TEMP/chk-paiements-release.jks" >> "$GITHUB_ENV"
      - name: Compiler APK signé
        if: steps.signature.outputs.ready == 'true'
        env:
          PAYMENTS_KEYSTORE_PASSWORD: ${{ secrets.PAYMENTS_KEYSTORE_PASSWORD }}
          PAYMENTS_KEY_ALIAS: ${{ secrets.PAYMENTS_KEY_ALIAS }}
          PAYMENTS_KEY_PASSWORD: ${{ secrets.PAYMENTS_KEY_PASSWORD }}
        run: |
          gradle --no-daemon :app:assembleRelease -PversionName="$VERSION" -PversionCode="$VERSION_CODE"
          test -s app/build/outputs/apk/release/app-release.apk
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APK_SIGNER"
          "$APK_SIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$ASSET"
          sha256sum "$ASSET" > "$ASSET.sha256"
      - name: Publier une release stable pour SkillMajAuto
        if: steps.signature.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo 'Cette version est déjà publiée. Refus de modifier une release existante.'
            exit 1
          fi
          gh release create "v$VERSION" "$ASSET" "$ASSET.sha256" --title "CHK Paiements v$VERSION" --notes 'APK signé. Mise à jour SkillMajAuto vérifiée par signature Android et version supérieure.' --latest
      - name: Nettoyer la clé
        if: steps.signature.outputs.ready == 'true'
        if: always()
        run: rm -f "$RUNNER_TEMP/chk-paiements-release.jks"
