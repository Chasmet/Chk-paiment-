plugins { id 'com.android.application' }
def ciVersionCode = providers.gradleProperty('versionCode').orNull
def ciVersionName = providers.gradleProperty('versionName').orNull

android {
  namespace 'com.chk.paiements'
  compileSdk 35

  defaultConfig {
    applicationId 'com.chk.paiements'
    minSdk 26
    targetSdk 35
    versionCode ciVersionCode != null ? ciVersionCode.toInteger() : 1
    versionName ciVersionName != null ? ciVersionName : '0.1.0'
  }

  signingConfigs {
    release {
      def keystoreFile = System.getenv('PAYMENTS_KEYSTORE_FILE')
      if (keystoreFile && file(keystoreFile).isFile() &&
          System.getenv('PAYMENTS_KEYSTORE_PASSWORD') &&
          System.getenv('PAYMENTS_KEY_ALIAS') &&
          System.getenv('PAYMENTS_KEY_PASSWORD')) {
        storeFile file(keystoreFile)
        storePassword System.getenv('PAYMENTS_KEYSTORE_PASSWORD')
        keyAlias System.getenv('PAYMENTS_KEY_ALIAS')
        keyPassword System.getenv('PAYMENTS_KEY_PASSWORD')
      }
    }
  }

  buildTypes {
    debug {
      applicationIdSuffix '.debug'
      versionNameSuffix '-debug'
    }
    release {
      minifyEnabled false
      if (System.getenv('PAYMENTS_KEYSTORE_FILE') && file(System.getenv('PAYMENTS_KEYSTORE_FILE')).isFile()) {
        signingConfig signingConfigs.release
      }
    }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
  implementation 'androidx.work:work-runtime:2.10.2'
  implementation 'androidx.core:core:1.15.0'
  testImplementation 'junit:junit:4.13.2'
}
